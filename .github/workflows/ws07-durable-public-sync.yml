name: WS07 durable public release sync

on:
  push:
    branches:
      - release/art01-current-reproducibility-r01
    paths:
      - .ws07_sync/public_payload.b64
      - .github/workflows/ws07-durable-public-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack exact prepared payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ws07_sync/public_payload.b64 > /tmp/ws07_public_payload.tar.gz
          echo "2d9b736c8190412536bbef368cf8019bd35b5b4ee606cde8645c6f346f5e2542  /tmp/ws07_public_payload.tar.gz" | sha256sum -c -
          rm -rf /tmp/ws07_public_payload
          mkdir -p /tmp/ws07_public_payload
          tar -xzf /tmp/ws07_public_payload.tar.gz -C /tmp/ws07_public_payload
          cp -a /tmp/ws07_public_payload/. ./

      - name: Enforce allowlist-only current release surface
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .ws07_sync/public_payload.b64|.github/workflows/ws07-durable-public-sync.yml) continue ;;
            esac
            if ! grep -Fxq "$f" PUBLIC_ALLOWLIST.txt; then
              git rm -f --ignore-unmatch -- "$f"
            fi
          done < <(git ls-files)

      - name: Freeze final SHA-256 manifest after materialization
        shell: bash
        run: |
          set -euo pipefail
          : > SHA256SUMS.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ "$f" = "SHA256SUMS.txt" ] && continue
            test -f "$f"
            sha256sum "$f" >> SHA256SUMS.txt
          done < PUBLIC_ALLOWLIST.txt
          sha256sum -c SHA256SUMS.txt

      - name: Bounded smoke verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_public_assets.py --check
          python scripts/verify_release.py
          test ! -e CITATION.cff
          test ! -e .zenodo.json
          test ! -e results/daily_baseline_results.csv
          test ! -e results/monthly_baseline_results.csv
          test ! -e metadata/benchmark_temporal_splits.csv
          test ! -e mappings/catalogo_delitos_homologado_ICCS_UNODC.csv

      - name: Commit durable audited staging surface
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .ws07_sync/public_payload.b64 .github/workflows/ws07-durable-public-sync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize ART-01 v1.0.0 reproducibility staging for R06.5"
          git push origin HEAD:release/art01-current-reproducibility-r01
