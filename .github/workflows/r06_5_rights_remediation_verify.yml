name: R06.5 bounded rights remediation verification

on:
  push:
    branches:
      - release/art01-current-reproducibility-r01

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/art01-current-reproducibility-r01

      - name: Regenerate deterministic public assets
        run: |
          python scripts/render_public_assets.py --write
          python scripts/render_public_assets.py --check

      - name: Regenerate SHA-256 manifest from allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          allow = [x.strip() for x in (root/'PUBLIC_ALLOWLIST.txt').read_text().splitlines() if x.strip()]
          assert len(allow) == len(set(allow)), 'duplicate allowlist entry'
          assert 'SHA256SUMS.txt' in allow
          lines = []
          for rel in allow:
              if rel == 'SHA256SUMS.txt':
                  continue
              p = root / rel
              assert p.is_file(), f'missing allowlisted file: {rel}'
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY

      - name: Cryptographic manifest verification
        run: sha256sum -c SHA256SUMS.txt

      - name: Bounded release verification
        run: python scripts/verify_release.py

      - name: CURRENT surface hygiene and history checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          forbidden_roots = ('results/', 'mappings/', 'splits/')
          assert not any(p.startswith(forbidden_roots) for p in tracked), 'historical incompatible path in CURRENT surface'
          assert 'CITATION.cff' not in tracked
          assert '.zenodo.json' not in tracked
          assert not any('.ws07_sync' in p for p in tracked)
          count = int(subprocess.check_output(['git','rev-list','--count','HEAD'], text=True).strip())
          assert count > 1, 'Git history unexpectedly absent'
          print(f'PASS current-surface hygiene; commit_history_count={count}')
          PY

      - name: Commit regenerated manifest and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r06_5_rights_remediation_verify.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit"
          else
            git commit -m "R06.5 remediation: regenerate verified public package [skip ci]"
            git push origin HEAD:release/art01-current-reproducibility-r01
          fi
